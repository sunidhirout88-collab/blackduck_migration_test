trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  # If Coverity CLI is already installed on agent, keep this as-is:
  BLACKDUCK_URL: https://blackduck.mycompany.com
  BD_PROJECT: my-app
  BD_VERSION: $(Build.SourceBranchName)
  DETECT_VERSION: latest
steps:
- checkout: self
  clean: true

# -----------------------------
# Optional: Use a specific Node version (POC-friendly)
# -----------------------------
- task: JavaToolInstaller@0
  displayName: Use Java 11
  inputs:
    versionSpec: '11'
    jdkArchitectureOption: x64
    jdkSourceOption: PreInstalled
- bash: "set -euo pipefail\n\necho \"Downloading Synopsys Detect...\"\ncurl -fsSL
    -o detect.sh https://detect.synopsys.com/detect.sh\nchmod +x detect.sh\n\necho
    \"Running Black Duck scan via Synopsys Detect...\"\n./detect.sh \\\n  --blackduck.url=\"\
    $(BLACKDUCK_URL)\" \\\n  --blackduck.api.token=\"$(BLACKDUCK_API_TOKEN)\" \\\n\
    \  --detect.project.name=\"$(BD_PROJECT)\" \\\n  --detect.project.version.name=\"\
    $(BD_VERSION)\" \\\n  --detect.source.path=\"$(Build.SourcesDirectory)\" \\\n\
    \  --detect.tools=DETECTOR,SIGNATURE_SCAN \\\n  --detect.detector.search.depth=6
    \\\n  --detect.wait.for.results=true \\\n  --detect.notices.report=true \\\n \
    \ --detect.risk.report.pdf=true \\\n  --logging.level.com.synopsys.integration=INFO
    \\\n  --detect.cleanup=true"
  displayName: Black Duck Scan (Synopsys Detect)
  env:
    BLACKDUCK_API_TOKEN: $(BLACKDUCK_API_TOKEN)
- task: PublishBuildArtifacts@1
  displayName: Publish Black Duck Reports
  inputs:
    PathtoPublish: $(Build.SourcesDirectory)/blackduck
    ArtifactName: blackduck-reports
  condition: succeededOrFailed()
- task: NodeTool@0
  inputs:
    versionSpec: "18.x"
  displayName: "Use Node.js 18"
