trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Non-secret values can live here or in variable groups
  POLARIS_APP_NAME: 'MyApp'
  POLARIS_PROJECT_NAME: 'MyProject'
  POLARIS_BRANCH_NAME: '$(Build.SourceBranchName)'

steps:
- checkout: self
  fetchDepth: 0

# 1) Download Bridge CLI (you host the zip internally OR use your allowed download endpoint)
- bash: |
    set -euo pipefail
    mkdir -p $(Agent.TempDirectory)/bridge
    cd $(Agent.TempDirectory)/bridge

    echo "Download Bridge CLI zip..."
    # Example: curl -L -o bridge.zip "<YOUR_BRIDGE_CLI_ZIP_URL>"
    # unzip bridge.zip
    # chmod +x bridge-cli

    echo "Bridge CLI ready at: $(Agent.TempDirectory)/bridge/bridge-cli"
  displayName: 'Install Synopsys Bridge CLI'

# 2) Run Polaris stage using Bridge CLI
- bash: |
    set -euo pipefail

    export BRIDGE_polaris_accessToken="$(POLARIS_ACCESS_TOKEN)"

    $(Agent.TempDirectory)/bridge/bridge-cli --stage polaris \
      polaris.serverUrl="$(POLARIS_SERVER_URL)" \
      polaris.application.name="$(POLARIS_APP_NAME)" \
      polaris.project.name="$(POLARIS_PROJECT_NAME)" \
      polaris.branch.name="$(POLARIS_BRANCH_NAME)" \
      polaris.assessment.types="SAST,SCA"

  displayName: 'Run Polaris Scan via Bridge CLI'
  env:
    POLARIS_SERVER_URL: $(POLARIS_SERVER_URL)
    POLARIS_ACCESS_TOKEN: $(POLARIS_ACCESS_TOKEN)   # mark as secret in ADO
